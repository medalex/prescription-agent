# MFSSIA for the prescription agent experiment, on DKG V10. The DKG node runs separately from
# dkg-node/dkg-v10-local (its own compose project), reached through the host port 9200; Postgres comes
# from MFSSIA's docker-compose.local.yml (migrations run at startup). From the mfssia-ehealth folder:
#   export DKG_V10_TOKEN=$(grep -v '^#' ../dkg-node/dkg-v10-local/data/auth.token | tr -d '[:space:]')
#   docker compose -f docker-compose.yml -f docker-compose.local.yml \
#     -f ../prescription-agent/infra/mfssia-override.yml up -d --build
services:
  app:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PILOT_DEMO_SEED: "true"
      EVIDENCE_REFERENCE_TIME: "2026-10-10T00:00:00Z"
      DKG_V10_URL: http://host.docker.internal:9200
      # Changes whenever the node is recreated, so it is never written here.
      DKG_V10_TOKEN: ${DKG_V10_TOKEN:?export DKG_V10_TOKEN (the last line of dkg-v10-local/data/auth.token)}
      DKG_CONTEXT_GRAPH: mfssia-ehealth
      DKG_WRITE_MODE: draft
